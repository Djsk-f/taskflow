services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?variable requise, voir .env.example}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskflow}
      MYSQL_USER: ${MYSQL_USER:-taskflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?variable requise, voir .env.example}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - taskflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Boîte aux lettres de démonstration : l'API y envoie ses récapitulatifs, et on les lit
  # sur http://localhost:8025. Rien ne sort vers Internet.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./task-manager-api-v1
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      # Dans le réseau Docker, MySQL se joint par son nom de service et son port interne,
      # quel que soit le port publié sur la machine (DB_PORT).
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskflow}
      MYSQL_USER: ${MYSQL_USER:-taskflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?variable requise, voir .env.example}
      JWT_SECRET: ${JWT_SECRET:?variable requise, voir .env.example}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_DEMO_DATA: ${APP_DEMO_DATA:-true}
      APP_NOTIFICATIONS_SCAN_INTERVAL_MS: ${APP_NOTIFICATIONS_SCAN_INTERVAL_MS:-30000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      # Récapitulatif par e-mail : Mailpit capture tout en local (aucun envoi vers Internet).
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-TaskFlow <no-reply@taskflow.local>}
      APP_MAIL_DIGEST_HOUR: ${APP_MAIL_DIGEST_HOUR:-7}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ./task-manager-web-v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  taskflow-mysql-data:
