spring:
  datasource:
    url: jdbc:h2:mem:taskflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQtdW5pcXVlbWVudC1wb3VyLWxlcy10ZXN0cy1hdS1tb2lucy0zMi1vY3RldHM=
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.taskflow.api: INFO
