spring:
  application:
    name: task-manager-api-v1
  # Le .env racine est lu directement : `./mvnw spring-boot:run` suffit, sans `source`,
  # sur Linux, macOS comme Windows. Lancé depuis le module ou depuis la racine.
  # Une vraie variable d'environnement reste prioritaire (déploiement, CI).
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    # URL composée à partir des MÊMES variables que docker-compose : changer DB_PORT suffit.
    # Volontairement pas de variable SPRING_DATASOURCE_URL : Spring l'appliquerait d'office,
    # y compris par-dessus la base H2 des tests (V-037).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:taskflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  # Messages renvoyés au client en français (défaut) ou en anglais selon Accept-Language.
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: fr
    locale-resolver: accept-header

server:
  # Cloud Run injecte PORT ; SERVER_PORT reste pour Docker Compose et le développement local.
  port: ${PORT:${SERVER_PORT:8080}}
  # Requêtes en cours terminées avant l'arrêt de l'instance (nouvelle révision, mise à l'échelle).
  shutdown: graceful
  # Derrière un proxy (Cloud Run, nginx) : l'application voit le schéma et l'hôte d'origine.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Compte de démonstration créé au démarrage s'il n'existe pas (voir DemoDataLoader).
  # Rappels d'échéance générés par le serveur (voir NotificationScheduler).
  notifications:
    enabled: ${APP_NOTIFICATIONS_ENABLED:true}
    scan-interval-ms: ${APP_NOTIFICATIONS_SCAN_INTERVAL_MS:30000}
    # Rappel de saisie du temps (jours ouvrés, si activé dans le profil) : heure locale.
    zone: ${APP_TIMEZONE:Europe/Paris}
    daily-time-hour: 17
    # Récapitulatif quotidien par e-mail : coupé tant qu'aucun serveur d'envoi n'est configuré.
    email:
      enabled: ${APP_MAIL_ENABLED:false}
      from: ${APP_MAIL_FROM:TaskFlow <no-reply@taskflow.local>}
      hour: ${APP_MAIL_DIGEST_HOUR:7}
  # Lien vers l'application dans les e-mails.
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  demo-data:
    enabled: ${APP_DEMO_DATA:false}
    # Identifiants publics de la démo (documentés dans le README), pas un secret.
    password: ${APP_DEMO_PASSWORD:Demo2026!}

springdoc:
  swagger-ui:
    # Le jeton saisi via « Authorize » survit au rechargement de la page.
    persist-authorization: true
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # L'état de l'application ne dépend pas du serveur d'envoi d'e-mails : le récapitulatif
    # est facultatif, une panne SMTP ne doit pas rendre l'API « malade » (ni bloquer Docker).
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.taskflow.api: DEBUG
