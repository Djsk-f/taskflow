server {
    listen 80;
    server_name _;
    # Ne pas annoncer la version de nginx.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API relayée : pour le navigateur, interface et API ont la même origine.
    # `$http_host` conserve le port, pour que Spring reconnaisse une requête de même origine.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers nommés par empreinte de contenu : cache long.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute autre route renvoie index.html (React Router).
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
