# En-têtes de sécurité, inclus dans CHAQUE bloc location : nginx n'hérite pas des
# add_header du bloc server dès qu'un location en déclare un (ici Cache-Control).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Scripts : uniquement ceux du site (aucun script en ligne). Styles en ligne tolérés :
# les composants Radix et les notifications positionnent leurs éléments par attribut style.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
