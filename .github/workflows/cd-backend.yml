# Déploiement continu du backend : GitHub Actions → Artifact Registry → Cloud Run.

name: CD Backend

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  # Indispensable à OIDC : GitHub signe le jeton d'identité présenté à Google.
  id-token: write
  contents: read

# Un seul déploiement à la fois ; celui en cours n'est jamais interrompu.
concurrency:
  group: cd-backend
  cancel-in-progress: false

env:
  # Nom de l'image dans le dépôt Artifact Registry.
  IMAGE_NAME: taskflow-api

jobs:
  deploy:
    name: Artifact Registry puis Cloud Run
    # Deux conditions : la CI doit avoir réussi, et la configuration GCP doit exister.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
          && vars.GCP_SERVICE_ACCOUNT != ''
          && vars.GCP_REGION != ''
          && vars.GCP_ARTIFACT_REPOSITORY != ''
          && vars.CLOUD_RUN_SERVICE != '' }}
    runs-on: ubuntu-latest
    steps:
      # Le commit exact validé par la CI, et non la tête de branche : sans cela, un push
      # survenu entre-temps serait déployé sans avoir été testé.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Fédération d'identité : aucun secret longue durée. `access_token` sert ensuite
      # à ouvrir une session Docker vers Artifact Registry.
      - id: auth
        name: Authentification GCP (OIDC)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || 'taskflow-d3e9c' }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Connexion à Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      # Étiquette immuable : le SHA du commit validé. Une révision Cloud Run pointe donc
      # toujours vers un contenu précis, et un retour arrière consiste à redéployer un SHA.
      - id: image
        name: Calculer la référence de l'image
        run: |
          echo "ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || 'taskflow-d3e9c' }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      # Même Dockerfile et même contexte que la CI : rien n'est dupliqué ni réécrit.
      - name: Construire et pousser l'image backend
        uses: docker/build-push-action@v7
        with:
          context: task-manager-api-v1
          push: true
          tags: ${{ steps.image.outputs.ref }}

      # La configuration d'exécution (base de données, JWT_SECRET, e-mails) appartient au
      # service Cloud Run lui-même, via Secret Manager : ce workflow ne fait que remplacer
      # l'image, il ne transporte aucun secret.
      - id: deploy
        name: Déployer sur Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.ref }}

      - name: Résumé
        run: |
          {
            echo "### Backend déployé"
            echo ""
            echo "- Commit : \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Image  : \`${{ steps.image.outputs.ref }}\`"
            echo "- URL    : ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
