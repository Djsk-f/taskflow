# Prévisualisation Firebase de chaque pull request (URL commentée sur la PR).
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    # Les PR de forks n'ont pas accès aux secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-manager-web-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: task-manager-web-v1/package-lock.json

      - run: npm ci

      # Échoue si la variable de dépôt VITE_API_BASE_URL est absente ou relative.
      - name: Vérifier l'URL de l'API
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          SECRET_DU_MEME_NOM: ${{ secrets.VITE_API_BASE_URL != '' }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            if [ "$SECRET_DU_MEME_NOM" = "true" ]; then
              echo "::error title=VITE_API_BASE_URL créée comme secret::La recréer dans l'onglet Variables (Settings > Secrets and variables > Actions)."
            else
              echo "::error title=VITE_API_BASE_URL manquante::La créer dans Settings > Secrets and variables > Actions > Variables."
            fi
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            https://*/api/v1) echo "URL de l'API : $VITE_API_BASE_URL" ;;
            *) echo "::error title=VITE_API_BASE_URL invalide::Attendu : https://<hôte>/api/v1, reçu : $VITE_API_BASE_URL"; exit 1 ;;
          esac

      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # Sans channelId : canal de prévisualisation propre à la PR.
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASKFLOW_D3E9C }}
          projectId: taskflow-d3e9c
          entryPoint: task-manager-web-v1
