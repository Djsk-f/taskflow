name: CI

# Intégration continue du monorepo, en trois temps :
#
#   api + web  (en parallèle : deux projets indépendants)
#        ↓
#   secrets    (Gitleaks : inutile de chercher des secrets si le code ne compile pas)
#        ↓
#   images     (construction des images Docker, puis scan Trivy de chacune)
#
# Une étape en échec arrête la suite : rien n'est construit ni scanné pour rien.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push annule l'exécution précédente de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule : la CI ne publie rien et n'écrit pas dans le dépôt.
permissions:
  contents: read

jobs:
  api:
    name: API — tests et package (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-manager-api-v1
    steps:
      - uses: actions/checkout@v4

      # Java 21 : la version déclarée par <java.version> dans pom.xml.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` compile, exécute les tests et package le jar en une commande.
      # Les tests tournent sur une base H2 en mémoire (profil test) : ni MySQL ni secret.
      - name: Tests et package
        run: ./mvnw -B verify

  web:
    name: Interface — lint, tests et build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-manager-web-v1
    steps:
      - uses: actions/checkout@v4

      # Node 22 : Vite 8 et TypeScript 6 exigent Node >= 20.19 ou >= 22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: task-manager-web-v1/package-lock.json

      # `npm ci` (et non `npm install`) : installation reproductible depuis le lockfile.
      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      # `npm run build` = `tsc -b && vite build` : la vérification stricte des types
      # fait donc échouer le job. VITE_API_BASE_URL est validée au démarrage de
      # l'application : sans elle, le bundle embarquerait une URL absente.
      - name: Build de production
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

  secrets:
    name: Secrets — Gitleaks
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      # Historique complet : un secret retiré depuis reste présent dans les anciens commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3 : version maintenue de l'action. La clé de licence n'est exigée que pour les
      # dépôts appartenant à une organisation ; ce dépôt appartient à un compte personnel.
      # Le scan échoue dès qu'un secret est détecté.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Règles par défaut + la seule exception du dépôt, documentée dans ce fichier.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pas de commentaire automatique sur les PR : la CI reste en lecture seule.
          GITLEAKS_ENABLE_COMMENTS: false

  images:
    name: Image ${{ matrix.image }} — construction et scan
    runs-on: ubuntu-latest
    needs: secrets
    strategy:
      # Un échec sur une image ne masque pas le résultat de l'autre.
      fail-fast: false
      matrix:
        include:
          - image: api
            context: task-manager-api-v1
          - image: web
            context: task-manager-web-v1
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Construite localement (`load`), jamais publiée : la publication viendra avec le CD.
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: taskflow-${{ matrix.image }}:${{ github.sha }}

      # Politique : une vulnérabilité HIGH ou CRITICAL **pour laquelle un correctif existe**
      # arrête le pipeline (exit-code 1). `ignore-unfixed` écarte celles qui n'ont pas encore
      # de correctif publié : les signaler bloquerait la chaîne sans aucune action possible.
      # Elles restent visibles en retirant cette option.
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
