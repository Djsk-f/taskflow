name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push annule l'exécution précédente de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-manager-api-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Base H2 en mémoire (profil test) : ni MySQL ni secret nécessaires.
      - run: ./mvnw -B verify

  web:
    name: Web — lint et build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-manager-web-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: task-manager-web-v1/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Vérification stricte des types (tsc -b) puis build de production.
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag taskflow-api ./task-manager-api-v1
      - run: docker build --tag taskflow-web ./task-manager-web-v1
